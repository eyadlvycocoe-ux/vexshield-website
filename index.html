<html lang="en">

<head>

  <title>VexShield — FiveM Security & Protection</title>
  <meta name="description"
    content="VexShield provides next-generation security and anticheat protection for FiveM servers with real-time detection and seamless performance.">
  <meta name="keywords"
    content="FiveM, Anticheat, FiveM Protection, VexShield, FiveM Security, AC, FiveM Guard">
  <meta name="author" content="VexShield Security Team" />
  <link rel="canonical" href="https://vexshield.com/" />

  <!-- Open Graph Meta Tags for Facebook, Discord & Web Crawlers -->
  <meta property="og:type" content="website" />

  <meta property="og:title" content="VexShield — FiveM Security & Protection" />

  <meta property="og:url" content="https://vexshield.com/" />
  <meta property="og:locale" content="en_US" />

  <style>
    html,
    body,
    #root {
      background-color: #0a0e14;
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }
  </style>
  <script>
    window.addEventListener('error', function (e) {
      if (e.message && (e.message.includes('Fetch') || e.message.includes('Loading chunk') || e.message.includes('importing a module script'))) {
        console.warn('Script loading error detected:', e.message);
      }
    });
  </script>
</head>

<body>
  <div id="root"></div>

  <!-- Static HTML fallback content for web crawlers (ChatGPT / Googlebot) -->
  <noscript>
    <main style="padding: 2rem; font-family: sans-serif; color: #fff; background: #080c14;">
      <h1>VexShield — FiveM Security & Protection</h1>
      <p>VexShield provides security tools for FiveM servers, including real-time anti-cheat detection, player intelligence, and zero FPS drop protection.</p>
      <img src="/logo.png" alt="VexShield FiveM Protection Suite Logo" />
    </main>
  </noscript>

  <script type="module" src="/src/main.tsx"></script>
</body>
